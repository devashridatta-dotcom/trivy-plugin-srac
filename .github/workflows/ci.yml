name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Validate JSON Schema fixtures
        run: |
          python -m pip install --disable-pip-version-check jsonschema==4.25.1
          python scripts/validate_json_schema.py
